[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web     = "4.10.2"
bcrypt        = "0.17.0"
reqwest       = { version = "0.11", features = ["json"] }
mongodb       = "3.2.2"
serde         = {version = "1.0.219", features = ["derive"]}
tokio         = {version = "1.44.0", features = ["full"]}
sqlx          = {version = "0.8.3", features = ["postgres", "runtime-tokio-native-tls"] }
dotenv        = "0.15.0"
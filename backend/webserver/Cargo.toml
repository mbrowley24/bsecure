[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web     = "4.10.2"
bcrypt        = "0.17.0"
chrono        = { version = "0.4.5", features = ["serde"] }
dotenv        = "0.15.0"
jsonwebtoken  = "9.3.1"
log           = "0.4.26"
regex         = "1.11.1"
reqwest       = { version = "0.11", features = ["json"] }
serde         = { version = "1.0.219", features = ["derive"]}
tokio         = {version = "1.44.0", features = ["full"]}
uuid          = { version = "1", features = ["v4", "serde"] }
sqlx          = { version = "0.8.3", features = ["chrono", "postgres", "uuid" , "runtime-tokio", "tls-native-tls"] }

